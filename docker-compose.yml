services:
  postgres:
    image: postgres:16-alpine
    container_name: nordflow-postgres
    environment:
      POSTGRES_DB: nordflow_auth
      POSTGRES_USER: nordflow
      POSTGRES_PASSWORD: pass123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: