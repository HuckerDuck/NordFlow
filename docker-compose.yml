services:
  postgres:
    image: postgres:16-alpine
    container_name: nordflow-postgres
    environment:
      POSTGRES_DB: nordflow_auth
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
