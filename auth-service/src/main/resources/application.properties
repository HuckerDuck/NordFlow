spring.application.name=NordFlow - auth-service

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nordflow_auth}
spring.datasource.username=${DB_USERNAME:nordflow}
spring.datasource.password=${DB_PASSWORD:nordflow}

# JPA: Flyway owns the schema, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=classpath:db/migration
