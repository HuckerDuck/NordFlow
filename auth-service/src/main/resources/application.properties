spring.application.name=NordFlow-auth-service

## Database connection enviromental details ##
spring.datasource.url=jdbc:postgresql://${DB_ADDRESS}:${DB_PORT}/postgres
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
server.port=${SERVER_PORT}

## For the JWT ##
jwtSecret=${JWT_SECRET}
jwtExpirationMs=${JWT_EXPIRATION_MS}

## For the JPA Database
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

## For the Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.enabled=true